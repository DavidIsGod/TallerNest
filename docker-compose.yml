services:
  db:
    image: postgres:16-alpine
    container_name: mediplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediplan
    ports:
      - '5432:5432'
    volumes:
      - mediplan-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['full']
    build: .
    container_name: mediplan-api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - '3000:3000'

volumes:
  mediplan-data:
