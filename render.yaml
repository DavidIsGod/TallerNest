# Blueprint de Render (https://render.com/docs/blueprint-spec)
# Crea la base de datos PostgreSQL y el servicio web de la API.
# El despliegue lo dispara GitHub Actions (deploy hook) solo si las pruebas pasan.
databases:
  - name: mediplan-db
    plan: free
    databaseName: mediplan
    user: mediplan

services:
  - type: web
    name: mediplan-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: mediplan-db
          property: connectionString
      - key: DB_SSL
        value: 'false'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mediplan.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: OPENFDA_ENABLED
        value: 'true'
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
